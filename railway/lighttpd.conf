server.modules = (
"mod_setenv",
)
$HTTP["url"] =~ "^/" {
    setenv.set-response-header = (
        "Cache-Control" => "no-store, no-cache, must-revalidate, max-age=0"
    )
}
server.port = 80
server.document-root = "/var/www/html"
index-file.names = ( "index.html", "index.htm" )
mimetype.assign = (
  ".html" => "text/html",
  ".htm"  => "text/html",
  ".txt"  => "text/plain",
  ".css"  => "text/css",
  ".js"   => "application/javascript",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif"  => "image/gif"
)